<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-primary text-white py-4">
        <div class="container">
            <h1 class="h3 mb-0">Biblioteca Universitária</h1>
        </div>
    </header>

    <main class="container my-4">
        <div id="mensagem" class="alert d-none" role="alert"></div>

        <div class="row g-3 mb-4">
            <div class="col-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="mb-1">Total</p>
                        <p id="total" class="numero mb-0">0</p>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="mb-1">Livros</p>
                        <p id="totalLivros" class="numero mb-0">0</p>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card text-center">
                    <div class="card-body">
                        <p class="mb-1">Revistas</p>
                        <p id="totalRevistas" class="numero mb-0">0</p>
                    </div>
                </div>
            </div>
        </div>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h5">Cadastro e edição</h2>
                <form id="form" class="row g-3" novalidate>
                    <div class="col-12 col-md-4">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" class="form-select">
                            <option value="livro">Livro</option>
                            <option value="revista">Revista</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-5">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" id="titulo" class="form-control">
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="ano" class="form-label">Ano de publicação</label>
                        <input type="number" id="ano" class="form-control" min="0">
                    </div>

                    <div id="camposLivro" class="row g-3 m-0">
                        <div class="col-12 col-md-6">
                            <label for="autor" class="form-label">Autor</label>
                            <input type="text" id="autor" class="form-control">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="paginas" class="form-label">Páginas</label>
                            <input type="number" id="paginas" class="form-control" min="1">
                        </div>
                    </div>

                    <div id="camposRevista" class="row g-3 m-0 d-none">
                        <div class="col-12 col-md-6">
                            <label for="edicao" class="form-label">Edição</label>
                            <input type="number" id="edicao" class="form-control" min="1">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="mes" class="form-label">Mês de publicação (1 a 12)</label>
                            <input type="number" id="mes" class="form-control" min="1" max="12">
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" id="btnSalvar" class="btn btn-primary">Cadastrar</button>
                        <button type="button" id="btnCancelar" class="btn btn-secondary">Limpar</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card">
            <div class="card-body">
                <h2 class="h5">Materiais cadastrados</h2>
                <p id="textoVazio" class="d-none mb-0">Nenhum material cadastrado.</p>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Título</th>
                                <th scope="col">Ano</th>
                                <th scope="col">Detalhes</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
